<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ultimate Automation Torture Fixture</title>

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 24px;
    background: #f2f2f2;
    line-height: 1.4;
  }

  h1 {
    margin-bottom: 6px;
  }

  .section {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

  .row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin: 16px 0;
    flex-wrap: wrap;
  }

  .label {
    width: 280px;
    font-weight: bold;
  }

  .toggle {
    width: 70px;
    height: 36px;
    border-radius: 999px;
    background: gray;
    position: relative;
    cursor: pointer;
    transition: 0.3s;
  }

  .toggle::before {
    content: "";
    position: absolute;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: white;
    top: 4px;
    left: 4px;
    transition: 0.3s;
  }

  .toggle.on {
    background: dodgerblue;
  }

  .toggle.on::before {
    transform: translateX(34px);
  }

  .disabled {
    pointer-events: none;
    opacity: 0.5;
  }

  .overlay-wrapper {
    position: relative;
    display: inline-block;
  }

  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,0,0,0.2);
    z-index: 999;
  }

  .moving {
    transform: translateX(120px);
  }

  .infinite-animation {
    animation: pulse 1s infinite;
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.08); }
    100% { transform: scale(1); }
  }

  .virtual-spacer {
    height: 1200px;
  }

  #event-log {
    background: black;
    color: #00ff66;
    padding: 12px;
    height: 300px;
    overflow: auto;
    font-family: monospace;
    border-radius: 8px;
    white-space: pre-wrap;
  }

  iframe {
    width: 100%;
    height: 160px;
    border: 1px solid #ccc;
  }

  .opacity-zero {
    opacity: 0;
  }

  .visibility-hidden {
    visibility: hidden;
  }

  .display-none {
    display: none;
  }

  .pointer-blocked {
    pointer-events: none;
  }

  .drag-container {
    width: 200px;
    height: 40px;
    background: #ddd;
    position: relative;
    border-radius: 999px;
  }

  .drag-knob {
    width: 36px;
    height: 36px;
    background: white;
    border-radius: 50%;
    position: absolute;
    top: 2px;
    left: 2px;
    cursor: grab;
  }

  canvas {
    border: 1px solid #aaa;
  }

  .toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: black;
    color: white;
    padding: 12px;
    border-radius: 8px;
    z-index: 9999;
  }

</style>
</head>
<body>

<h1>Ultimate Automation Torture Fixture</h1>

<p>
Designed for Selenium, Playwright, Cypress, WebDriverIO,
Appium, accessibility testing, flaky test detection,
actionability checks, stale elements, rerenders,
shadow DOM, virtualization, gestures, and overlays.
</p>

<div id="fixture-metrics" class="section">
  <h2>Metrics</h2>
  <div id="metrics"></div>
</div>

<div id="sections"></div>

<div class="section">
  <h2>Event Log</h2>
  <div id="event-log"></div>
</div>

<script>

const metrics = {
  clicks: 0,
  rerenders: 0,
  detached: 0
};

function updateMetrics() {
  document.getElementById('metrics').innerHTML =
    `
      Clicks: ${metrics.clicks}<br>
      Rerenders: ${metrics.rerenders}<br>
      Detached Elements: ${metrics.detached}
    `;
}

function log(message) {
  const el = document.getElementById('event-log');

  el.textContent +=
    `[${new Date().toLocaleTimeString()}] ${message}\n`;

  el.scrollTop = el.scrollHeight;
}

function toggle(el) {
  el.classList.toggle('on');

  metrics.clicks++;

  updateMetrics();
}

function createSection(title, html) {
  const wrapper = document.createElement('div');

  wrapper.className = 'section';

  wrapper.innerHTML = `<h2>${title}</h2>${html}`;

  document.getElementById('sections')
    .appendChild(wrapper);
}

/* ===================================================== */
/* 1. Native Checkbox */
/* ===================================================== */

createSection('1. Native Checkbox', `
<div class="row">
  <div class="label">Native Input</div>
  <input type="checkbox" id="native-checkbox">
</div>
`);

/* ===================================================== */
/* 2. ARIA Switch */
/* ===================================================== */

createSection('2. ARIA Switch', `
<div class="row">
  <div class="label">role=switch</div>
  <button
    id="aria-switch"
    role="switch"
    aria-checked="false">
    OFF
  </button>
</div>
`);

document.addEventListener('click', e => {

  if (e.target.id === 'aria-switch') {

    const checked =
      e.target.getAttribute('aria-checked') === 'true';

    e.target.setAttribute(
      'aria-checked',
      (!checked).toString()
    );

    e.target.textContent =
      checked ? 'OFF' : 'ON';

    log('ARIA switch toggled');
  }
});

/* ===================================================== */
/* 3. Delayed Async Toggle */
/* ===================================================== */

createSection('3. Async Toggle', `
<div class="row">
  <div class="label">Delayed State Change</div>

  <div id="async-toggle" class="toggle"></div>

  <span id="async-status">Idle</span>
</div>
`);

document.getElementById('async-toggle')
.onclick = function () {

  const el = this;

  document.getElementById('async-status')
    .textContent = 'Saving...';

  setTimeout(() => {

    toggle(el);

    document.getElementById('async-status')
      .textContent = 'Saved';

    log('Async toggle completed');

  }, 1500);
};

/* ===================================================== */
/* 4. Overlay Interception */
/* ===================================================== */

createSection('4. Overlay Interception', `
<div class="row">
  <div class="label">Covered for 4 seconds</div>

  <div class="overlay-wrapper">

    <div id="overlay-toggle"
      class="toggle"></div>

    <div id="overlay"
      class="overlay"></div>

  </div>
</div>
`);

setTimeout(() => {

  document.getElementById('overlay')
    ?.remove();

  log('Overlay removed');

}, 4000);

document.getElementById('overlay-toggle')
.onclick = function () {

  toggle(this);

  log('Overlay toggle clicked');
};

/* ===================================================== */
/* 5. Detached During Click */
/* ===================================================== */

createSection('5. Detached During Click', `
<div class="row">
  <div class="label">Removes itself on mousedown</div>

  <button id="detach-toggle">
    CLICK ME
  </button>
</div>
`);

const detachBtn =
  document.getElementById('detach-toggle');

detachBtn.addEventListener('mousedown', () => {

  metrics.detached++;

  updateMetrics();

  detachBtn.remove();

  log('Detached button removed');
});

/* ===================================================== */
/* 6. Rapid Re-render */
/* ===================================================== */

createSection('6. Rapid Re-render', `
<div class="row">
  <div class="label">Rerenders every 500ms</div>

  <div id="rerender-container"></div>
</div>
`);

function renderRerender() {

  metrics.rerenders++;

  updateMetrics();

  const c =
    document.getElementById('rerender-container');

  c.innerHTML = '';

  const btn =
    document.createElement('button');

  btn.textContent =
    Math.random() > 0.5 ? 'ON' : 'OFF';

  btn.id =
    'rerender-toggle';

  c.appendChild(btn);
}

renderRerender();

setInterval(renderRerender, 500);

/* ===================================================== */
/* 7. Pointer Events Blocked */
/* ===================================================== */

createSection('7. Pointer Events Disabled', `
<div class="row">
  <div class="label">pointer-events:none</div>

  <div id="pointer-toggle"
    class="toggle pointer-blocked"></div>
</div>
`);

/* ===================================================== */
/* 8. Visibility Variants */
/* ===================================================== */

createSection('8. Hidden States', `
<div class="row">
  <div class="label">opacity:0</div>
  <div id="opacity-toggle"
    class="toggle opacity-zero"></div>
</div>

<div class="row">
  <div class="label">visibility:hidden</div>
  <div id="visibility-toggle"
    class="toggle visibility-hidden"></div>
</div>

<div class="row">
  <div class="label">display:none</div>
  <div id="display-toggle"
    class="toggle display-none"></div>
</div>
`);

/* ===================================================== */
/* 9. Keyboard Toggle */
/* ===================================================== */

createSection('9. Keyboard Accessible', `
<div class="row">
  <div class="label">Space / Enter Toggle</div>

  <div
    id="keyboard-toggle"
    tabindex="0"
    role="switch"
    aria-checked="false"
    class="toggle">
  </div>
</div>
`);

const keyboardToggle =
  document.getElementById('keyboard-toggle');

keyboardToggle.addEventListener(
  'keydown',
  e => {

    if (
      e.key === ' ' ||
      e.key === 'Enter'
    ) {

      toggle(keyboardToggle);

      keyboardToggle.setAttribute(
        'aria-checked',
        keyboardToggle.classList.contains('on')
      );

      log('Keyboard toggle activated');
    }
  }
);

/* ===================================================== */
/* 10. Infinite Animation */
/* ===================================================== */

createSection('10. Infinite Animation', `
<div class="row">
  <div class="label">Never Settles</div>

  <div
    id="infinite-toggle"
    class="toggle infinite-animation">
  </div>
</div>
`);

/* ===================================================== */
/* 11. Moving Toggle */
/* ===================================================== */

createSection('11. Moving Toggle', `
<div class="row">
  <div class="label">Moves During Click</div>

  <div
    id="moving-toggle"
    class="toggle">
  </div>
</div>
`);

const moving =
  document.getElementById('moving-toggle');

moving.onclick = function () {

  toggle(this);

  this.classList.toggle('moving');

  log('Moving toggle clicked');
};

/* ===================================================== */
/* 12. Nested Shadow DOM */
/* ===================================================== */

createSection('12. Nested Shadow DOM', `
<nested-shadow-host></nested-shadow-host>
`);

class NestedShadowHost extends HTMLElement {

  constructor() {

    super();

    const root =
      this.attachShadow({ mode: 'open' });

    const wrapper =
      document.createElement('inner-shadow-host');

    root.appendChild(wrapper);
  }
}

class InnerShadowHost extends HTMLElement {

  constructor() {

    super();

    const root =
      this.attachShadow({ mode: 'open' });

    const div =
      document.createElement('div');

    div.className = 'toggle';

    div.id = 'nested-shadow-toggle';

    div.onclick = () => {

      div.classList.toggle('on');

      log('Nested shadow toggle clicked');
    };

    root.appendChild(div);
  }
}

customElements.define(
  'nested-shadow-host',
  NestedShadowHost
);

customElements.define(
  'inner-shadow-host',
  InnerShadowHost
);

/* ===================================================== */
/* 13. iframe */
/* ===================================================== */

createSection('13. iframe Toggle', `
<iframe
  srcdoc="
    <button
      id='frame-toggle'
      aria-pressed='false'>
      OFF
    </button>

    <script>
      const btn =
        document.getElementById('frame-toggle');

      btn.onclick = () => {

        const p =
          btn.getAttribute('aria-pressed')
          === 'true';

        btn.setAttribute(
          'aria-pressed',
          (!p).toString()
        );

        btn.innerText =
          p ? 'OFF' : 'ON';
      };
    <\/script>
  ">
</iframe>
`);

/* ===================================================== */
/* 14. Drag Toggle */
/* ===================================================== */

createSection('14. Drag Gesture', `
<div class="row">
  <div class="label">Drag Knob Right</div>

  <div class="drag-container">

    <div
      id="drag-knob"
      class="drag-knob">
    </div>

  </div>
</div>
`);

const knob =
  document.getElementById('drag-knob');

let dragging = false;

knob.addEventListener('mousedown', () => {
  dragging = true;
});

document.addEventListener('mouseup', () => {
  dragging = false;
});

document.addEventListener('mousemove', e => {

  if (!dragging) return;

  const x =
    Math.min(160,
      Math.max(2, e.clientX));

  knob.style.left = x + 'px';

  if (x > 120) {

    log('Drag toggle activated');

    knob.style.background = 'lime';
  }
});

/* ===================================================== */
/* 15. Canvas Toggle */
/* ===================================================== */

createSection('15. Canvas Toggle', `
<canvas
  id="canvas-toggle"
  width="120"
  height="60">
</canvas>
`);

const canvas =
  document.getElementById('canvas-toggle');

const ctx =
  canvas.getContext('2d');

let canvasOn = false;

function drawCanvas() {

  ctx.clearRect(0,0,120,60);

  ctx.fillStyle =
    canvasOn ? 'green' : 'gray';

  ctx.fillRect(10,10,100,40);
}

drawCanvas();

canvas.addEventListener('click', () => {

  canvasOn = !canvasOn;

  drawCanvas();

  log('Canvas toggled');
});

/* ===================================================== */
/* 16. SVG Toggle */
/* ===================================================== */

createSection('16. SVG Toggle', `
<svg width="120" height="60">

  <rect
    id="svg-toggle"
    x="10"
    y="10"
    width="100"
    height="40"
    rx="20"
    fill="gray">
  </rect>

</svg>
`);

document.getElementById('svg-toggle')
.addEventListener('click', function () {

  const fill =
    this.getAttribute('fill');

  this.setAttribute(
    'fill',
    fill === 'gray'
      ? 'green'
      : 'gray'
  );

  log('SVG toggle clicked');
});

/* ===================================================== */
/* 17. Toast Interference */
/* ===================================================== */

createSection('17. Toast Interference', `
<div class="row">
  <div class="label">Random Toast Overlay</div>

  <div id="toast-toggle"
    class="toggle"></div>
</div>
`);

setInterval(() => {

  const toast =
    document.createElement('div');

  toast.className = 'toast';

  toast.textContent =
    'Temporary Overlay';

  document.body.appendChild(toast);

  setTimeout(() => {

    toast.remove();

  }, 1500);

}, 6000);

/* ===================================================== */
/* 18. Virtualized Toggle */
/* ===================================================== */

createSection('18. Offscreen Toggle', `
<div class="virtual-spacer"></div>

<div class="row">
  <div class="label">Requires Scroll</div>

  <div
    id="offscreen-toggle"
    class="toggle">
  </div>
</div>
`);

/* ===================================================== */
/* 19. Mutation Storm */
/* ===================================================== */

createSection('19. Mutation Storm', `
<div class="row">
  <div class="label">Continuously Mutates</div>

  <div id="mutation-target"></div>
</div>
`);

setInterval(() => {

  document.getElementById(
    'mutation-target'
  ).textContent =
    Math.random();

}, 100);

/* ===================================================== */
/* 20. Randomized IDs */
/* ===================================================== */

createSection('20. Dynamic IDs', `
<div class="row">
  <div class="label">ID Changes Every 2s</div>

  <div
    id="dynamic-id-toggle"
    class="toggle">
  </div>
</div>
`);

setInterval(() => {

  const el =
    document.getElementById(
      'dynamic-id-toggle'
    );

  el.id =
    'toggle-' +
    Math.floor(Math.random() * 10000);

}, 2000);

/* ===================================================== */
/* Global Fixture API */
/* ===================================================== */

window.fixture = {

  reset() {

    location.reload();
  },

  disableAnimations() {

    document.querySelectorAll('*')
      .forEach(el => {

        el.style.animation = 'none';
        el.style.transition = 'none';
      });

    log('Animations disabled');
  },

  enableFlakeMode() {

    setInterval(() => {

      document.body.style.paddingLeft =
        Math.random() * 10 + 'px';

    }, 100);

    log('Flake mode enabled');
  }
};

updateMetrics();

log('Fixture initialized');

</script>

</body>
</html>
