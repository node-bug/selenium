<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element State Test Fixture</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; background-color: #f9f9f9; }
        section { margin-bottom: 40px; border: 1px solid #ccc; padding: 20px; border-radius: 8px; background-color: white; }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .field-group { margin-bottom: 15px; display: flex; flex-direction: column; gap: 5px; }
        label { font-weight: bold; }
        .inline-group { display: flex; align-items: center; gap: 10px; }
        .inline-group input { margin: 0; }
    </style>
</head>
<body>
    <h1>Element State Test Fixture</h1>

    <!-- Buttons Section -->
    <section id="buttons-section">
        <h2>Buttons</h2>
        <div class="field-group">
            <button id="btn-click-me">Click Me</button>
            <button id="btn-disabled" disabled>Disabled Button</button>
        </div>
    </section>

    <!-- Checkboxes Section -->
    <section id="checkboxes-section">
        <h2>Checkboxes</h2>
        <div class="field-group">
            <div class="inline-group">
                <input type="checkbox" id="checkbox-unchecked">
                <label for="checkbox-unchecked">CheckBox</label>
            </div>
            <div class="inline-group">
                <input type="checkbox" id="checkbox-checked" checked>
                <label for="checkbox-checked">Pre-Check Box</label>
            </div>
            <div class="inline-group">
                <input type="checkbox" id="checkbox-disabled" disabled>
                <label for="checkbox-disabled">Disabled CheckBox</label>
            </div>
        </div>
    </section>

    <!-- Radio Buttons Section -->
    <section id="radios-section">
        <h2>Radio Buttons</h2>
        <div class="field-group">
            <div class="inline-group">
                <input type="radio" id="radio-1" name="radio-group" value="1" checked>
                <label for="radio-1">RadioButton 1</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-2" name="radio-group" value="2">
                <label for="radio-2">RadioButton 2</label>
            </div>
            <div class="inline-group">
                <input type="radio" id="radio-3" name="radio-group" value="3">
                <label for="radio-3">RadioButton 3</label>
            </div>
        </div>
    </section>

    <!-- Scrollable Section -->
    <section id="scrollable-section">
        <h2>Scrollable Area</h2>
        <div class="field-group">
            <div id="scrollable-div" style="height: 100px; overflow-y: scroll; border: 1px solid #ddd; padding: 10px;">
                <div style="height: 300px;">
                    <p>Top Content</p>
                    <p style="margin-top: 100px;">Middle Content</p>
                    <p style="margin-top: 100px;">Bottom Content</p>
                </div>
            </div>
        </div>
    </section>

    <!-- Dynamic Section (used for late-appearing element tests) -->
    <section id="dynamic-section">
        <h2>Dynamic Element</h2>
        <div class="field-group">
            <div id="dynamic-container"></div>
        </div>
    </section>
</body>
</html>
